# Development override — hot reload for backend + frontend, source mounted
# straight from the host so edits show up without rebuilding images.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Applies pending Alembic migrations before starting the dev server, so a
    # fresh `postgres` volume doesn't leave the DB schema missing (every
    # endpoint would 500 with "relation ... does not exist" otherwise).
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"

volumes:
  storage:
